name: Run API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json' # Cache using lock if present

    - name: Install Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Backend Tests
      run: |
        cd backend
        npm test
      env:
        JWT_SECRET: testingjwtsecretmustbelongandsecure
        ENCRYPTION_SECRET: 8f515e0a0a56f6c99276bcbbbfcd5123d4567890abcdef0123456789abcdef01
        UPLOAD_DIR: ./test-uploads
